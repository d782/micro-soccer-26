<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Micro Soccer By PoloGames</title>
    <style>
      @font-face {
        font-family: 'KenneyFuture';
        src: url('/ui/Font/Kenney Future.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: 'KenneyFutureNarrow';
        src: url('/ui/Font/Kenney Future Narrow.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #111827;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #orientation-warning {
        display: none;
        position: fixed;
        inset: 0;
        background-color: #0b1320;
        color: #ffffff;
        z-index: 999999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
        font-family: 'KenneyFuture', sans-serif;
      }
      #orientation-warning .rotate-icon {
        font-size: 52px;
        margin-bottom: 20px;
        animation: rotatePhone 2s infinite ease-in-out;
      }
      #orientation-warning h2 {
        font-size: 24px;
        margin-bottom: 12px;
        color: #facc15;
      }
      #orientation-warning p {
        font-size: 14px;
        color: #cbd5e1;
        max-width: 320px;
        line-height: 1.5;
        font-family: sans-serif;
      }
      @keyframes rotatePhone {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      @media screen and (orientation: portrait) and (max-width: 900px) {
        #orientation-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="orientation-warning">
      <div class="rotate-icon">📱</div>
      <h2>GIRA TU TELÉFONO</h2>
      <p>Para ver la cancha a pantalla completa y jugar cómodamente, coloca tu teléfono en posición horizontal.</p>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
